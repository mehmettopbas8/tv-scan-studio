[project]
name = "tv-scan-studio"
version = "0.2.0"
description = "Local TradingView strategy parameter scan manager"
license = "AGPL-3.0-only"
requires-python = ">=3.11,<3.15"
dependencies = ["PySide6>=6.8,<7", "websocket-client>=1.8,<2", "reportlab>=4.4,<5"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pyinstaller>=6.10,<7"]

[project.scripts]
tv-scan-studio = "tv_scan_studio.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tv_scan_studio"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
