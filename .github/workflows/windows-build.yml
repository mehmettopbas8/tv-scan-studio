name: Windows test and portable build

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing v-tag to rebuild and publish; leave empty for build only
        required: false
        type: string

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q
      - name: Build portable application
        if: matrix.python-version == '3.13'
        run: pyinstaller --noconfirm --clean TVScanStudio.spec
      - name: Portable self-test
        if: matrix.python-version == '3.13'
        shell: pwsh
        run: |
          $process = Start-Process -FilePath "dist/TV-Scan-Studio.exe" -ArgumentList "--self-test" -Wait -PassThru -WindowStyle Hidden
          if ($null -eq $process.ExitCode -or $process.ExitCode -ne 0) { throw "Portable self-test failed: $($process.ExitCode)" }
      - name: Verify embedded single-file payload
        if: matrix.python-version == '3.13'
        run: >-
          python -c "from PyInstaller.archive.readers import CArchiveReader;
          names = list(CArchiveReader('dist/TV-Scan-Studio.exe').toc);
          assert any(name.endswith('Qt6Widgets.dll') for name in names), 'Qt runtime is not embedded';
          assert not any('ftmo_session_20260923' in name or 'ftmo_overnight_33075' in name or name.lower().endswith(('.db', '.sqlite', '.sqlite3', '.db-wal', '.db-shm')) for name in names), 'Private data in embedded EXE'"
      - name: Portable UI smoke test
        if: matrix.python-version == '3.13'
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $process = Start-Process -FilePath "dist/TV-Scan-Studio.exe" -ArgumentList "--ui-smoke-test" -Wait -PassThru -WindowStyle Hidden
          if ($null -eq $process.ExitCode -or $process.ExitCode -ne 0) { throw "Portable UI smoke failed: $($process.ExitCode)" }
      - name: Package and checksum
        if: matrix.python-version == '3.13'
        run: python tools/build_release.py dist/TV-Scan-Studio.exe --output dist --version 0.2.0
      - name: Verify portable archive
        if: matrix.python-version == '3.13'
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $archive = "dist/TV-Scan-Studio-0.2.0-portable.zip"
          $checksum = (Get-Content "$archive.sha256").Split(' ', [System.StringSplitOptions]::RemoveEmptyEntries)[0]
          $actual = (Get-FileHash $archive -Algorithm SHA256).Hash
          if ($checksum -ne $actual) { throw "Portable ZIP SHA-256 mismatch" }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [IO.Compression.ZipFile]::OpenRead($archive)
          try {
            if ($zip.Entries.Count -ne 1 -or $zip.Entries[0].FullName -ne 'TV-Scan-Studio/TV-Scan-Studio.exe') {
              throw "Single-file release must contain exactly one executable"
            }
            $private = @($zip.Entries | Where-Object {
              $_.FullName -match 'ftmo_session_20260923|ftmo_overnight_33075'
            })
            if ($private.Count) { throw "Private research data found in release ZIP" }
          } finally {
            $zip.Dispose()
          }
          Expand-Archive -LiteralPath $archive -DestinationPath "dist/release-check"
          $exe = "dist/release-check/TV-Scan-Studio/TV-Scan-Studio.exe"
          $sourceHash = (Get-FileHash "dist/TV-Scan-Studio.exe" -Algorithm SHA256).Hash
          $directExe = 'dist/TV-Scan-Studio-0.2.0.exe'
          $directChecksum = (Get-Content "$directExe.sha256").Split(' ', [System.StringSplitOptions]::RemoveEmptyEntries)[0]
          if ((Get-FileHash $directExe -Algorithm SHA256).Hash -ne $sourceHash -or $directChecksum -ne $sourceHash) {
            throw 'Direct EXE checksum mismatch'
          }
          if ((Get-FileHash $exe -Algorithm SHA256).Hash -ne $sourceHash) {
            throw "Extracted EXE differs from tested EXE"
          }
          foreach ($argument in @("--self-test", "--ui-smoke-test")) {
            $process = Start-Process -FilePath $exe -ArgumentList $argument -Wait -PassThru -WindowStyle Hidden
            if ($null -eq $process.ExitCode -or $process.ExitCode -ne 0) { throw "Extracted EXE failed $argument" }
          }
      - uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.13'
        with:
          name: TV-Scan-Studio-windows-x64
          path: |
            dist/TV-Scan-Studio-0.2.0.exe
            dist/TV-Scan-Studio-0.2.0.exe.sha256
            dist/TV-Scan-Studio-0.2.0-portable.zip
            dist/TV-Scan-Studio-0.2.0-portable.zip.sha256
  publish-release:
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(inputs.release_tag, 'v')
    needs: test-and-build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: TV-Scan-Studio-windows-x64
          path: dist
      - name: Publish tagged release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          $releaseArgs = @(
            'release', 'create', $env:RELEASE_TAG,
            'dist/TV-Scan-Studio-0.2.0.exe',
            'dist/TV-Scan-Studio-0.2.0.exe.sha256',
            'dist/TV-Scan-Studio-0.2.0-portable.zip',
            'dist/TV-Scan-Studio-0.2.0-portable.zip.sha256',
            '--verify-tag', '--title', "TV Scan Studio $env:RELEASE_TAG"
          )
          if ($env:RELEASE_TAG.Contains('-')) {
            $notes = 'Windows x64 release candidate. Run the single EXE; no Python installation or adjacent _internal directory is required. Verify SHA-256 before running. The package is unsigned and may trigger SmartScreen. Live packaged-worker interruption/recovery and broader user acceptance remain incomplete; this is not a stable release. Back up your local database before upgrading. See README for download and first-run instructions.'
            $releaseArgs += @('--prerelease', '--latest=false', '--notes', $notes)
          } else {
            $releaseArgs += '--generate-notes'
          }
          & gh @releaseArgs
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
