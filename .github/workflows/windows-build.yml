name: Windows test and portable build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q
      - name: Build portable application
        run: pyinstaller --noconfirm --clean TVScanStudio.spec
      - name: Package and checksum
        shell: pwsh
        run: |
          Compress-Archive -Path dist/TV-Scan-Studio/* -DestinationPath dist/TV-Scan-Studio-windows-x64.zip
          (Get-FileHash dist/TV-Scan-Studio-windows-x64.zip -Algorithm SHA256).Hash.ToLower() + "  TV-Scan-Studio-windows-x64.zip" | Set-Content dist/TV-Scan-Studio-windows-x64.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: TV-Scan-Studio-windows-x64
          path: |
            dist/TV-Scan-Studio-windows-x64.zip
            dist/TV-Scan-Studio-windows-x64.zip.sha256
