name: Windows test and portable build

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-and-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q
      - name: Build portable application
        run: pyinstaller --noconfirm --clean TVScanStudio.spec
      - name: Portable self-test
        shell: pwsh
        run: |
          $process = Start-Process -FilePath "dist/TV-Scan-Studio/TV-Scan-Studio.exe" -ArgumentList "--self-test" -Wait -PassThru -WindowStyle Hidden
          if ($process.ExitCode -ne 0) { exit $process.ExitCode }
      - name: Package and checksum
        run: python tools/build_release.py dist/TV-Scan-Studio --output dist --version 0.2.0
      - uses: actions/upload-artifact@v4
        with:
          name: TV-Scan-Studio-windows-x64
          path: |
            dist/TV-Scan-Studio-0.2.0-portable.zip
            dist/TV-Scan-Studio-0.2.0-portable.zip.sha256
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ github.ref_name }}"
          dist/TV-Scan-Studio-0.2.0-portable.zip
          dist/TV-Scan-Studio-0.2.0-portable.zip.sha256
          --title "TV Scan Studio ${{ github.ref_name }}"
          --generate-notes
